@if(isAddingTask) {
    <app-new-task (close)="onCloseTask()" [userId]="userId" />
}

<section id="tasks">
    <header>
        <h2>{{ name }}'s Taks</h2>
        <menu>
            <button (click)="onStartAddTask()">Add Taks</button>
        </menu>
    </header>

    <ul>
        @for (task of selectedUserTasks; track task.id) {
            <li>
                <app-task [task] = "task" />
            </li>
        }
    </ul>
</section>
